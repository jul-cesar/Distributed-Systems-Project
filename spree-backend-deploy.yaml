apiVersion: apps/v1
kind: Deployment
metadata:
  name: spree-backend
  namespace: interna
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spree-backend
  template:
    metadata:
      labels:
        app: spree-backend
    spec:
      nodeSelector:
        zona: interna
      containers:
        - name: spree
          image: spree-custom:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: RAILS_ENV
              value: "production"
            - name: DATABASE_URL
              value: "postgres://spreeuser:spreepass@postgres.interna.svc.cluster.local:5432/spreedb"
            - name: REDIS_URL
              value: "redis://redis.interna.svc.cluster.local:6379/0"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: spree-secret
                  key: SECRET_KEY_BASE
            # IMPORTANTE: Configuración para que Rails funcione detrás de proxy
            - name: RAILS_SERVE_STATIC_FILES
              value: "true"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            # Permitir hosts (importante para evitar errores de host bloqueado)
            - name: TRUSTED_HOSTS
              value: "www.proyectosd.com,spree-frontend.dmz.svc.cluster.local,localhost,localhost:30080"
            # URL pública para assets y URLs generadas
            - name: SPREE_FRONTEND_URL
              value: "http://localhost:30080"
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
