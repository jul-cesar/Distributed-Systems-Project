---
# Servicio para PostgreSQL Master (lectura/escritura)
apiVersion: v1
kind: Service
metadata:
  name: postgres-master
  namespace: interna
  labels:
    app: postgres
    role: master
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres
    role: master
  # Servicio headless para StatefulSet
  clusterIP: None

---
# Servicio para PostgreSQL Master con ClusterIP (para conexiones externas al StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: postgres-write
  namespace: interna
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres
    role: master

---
# Servicio para PostgreSQL Slaves (solo lectura)
apiVersion: v1
kind: Service
metadata:
  name: postgres-slave
  namespace: interna
  labels:
    app: postgres
    role: slave
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres
    role: slave
  # Servicio headless para StatefulSet
  clusterIP: None

---
# Servicio para acceso de solo lectura (load balancing entre slaves)
apiVersion: v1
kind: Service
metadata:
  name: postgres-read
  namespace: interna
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres
    role: slave

---
# Servicio legacy compatible (apunta al master para no romper nada)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: interna
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres
    role: master
