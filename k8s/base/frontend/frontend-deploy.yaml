apiVersion: apps/v1
kind: Deployment
metadata:
  name: spree-frontend
  namespace: dmz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spree-frontend
  template:
    metadata:
      labels:
        app: spree-frontend
    spec:
      nodeSelector:
        zona: dmz
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-config
          configMap:
            name: spree-frontend-config
