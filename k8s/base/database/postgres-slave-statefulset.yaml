apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-slave
  namespace: interna
spec:
  serviceName: postgres-slave
  replicas: 2 # 2 réplicas de solo lectura
  selector:
    matchLabels:
      app: postgres
      role: slave
  template:
    metadata:
      labels:
        app: postgres
        role: slave
    spec:
      nodeSelector:
        zona: interna
      initContainers:
        - name: clone-master
          image: postgres:15
          command:
            - /bin/bash
            - -c
            - |
              # Limpiar directorio de datos si existe
              rm -rf /var/lib/postgresql/data/*

              # Esperar a que el master esté disponible
              echo "Waiting for master to be ready..."
              sleep 20

              # Clonar datos del master usando pg_basebackup
              echo "Cloning data from master..."
              PGPASSWORD=replicator123 pg_basebackup \
                -h 10.100.204.80 \
                -D /var/lib/postgresql/data \
                -U replicator \
                -X stream \
                -P \
                -R

              echo "Clone completed successfully"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: spreeuser
            - name: POSTGRES_PASSWORD
              value: spreepass
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - spreeuser
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - spreeuser
            initialDelaySeconds: 60
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
